name: ridr-dev
services:
  database:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    environment:
      POSTGRES_USER: ridr_admin
      POSTGRES_DB: ridr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
      RIDR_MIGRATOR_PASSWORD: ${RIDR_MIGRATOR_PASSWORD:?Run npm run setup first}
      RIDR_API_PASSWORD: ${RIDR_API_PASSWORD:?Run npm run setup first}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - database:/var/lib/postgresql
      - ./database/init/01-roles.sql:/docker-entrypoint-initdb.d/20-ridr-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ridr_admin -d ridr']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  routing-driving:
    image: ghcr.io/project-osrm/osrm-backend:v26.9.0-debian
    profiles: [routing]
    command: ['osrm-routed', '--algorithm', 'mld', '/data/test-network.osrm']
    ports: ['127.0.0.1:5001:5000']
    volumes: ['./data/routing/driving:/data:ro']
  routing-cycling:
    image: ghcr.io/project-osrm/osrm-backend:v26.9.0-debian
    profiles: [routing]
    command: ['osrm-routed', '--algorithm', 'mld', '/data/test-network.osrm']
    ports: ['127.0.0.1:5002:5000']
    volumes: ['./data/routing/cycling:/data:ro']
  auth:
    image: supabase/gotrue:v2.196.0
    profiles: [auth]
    depends_on:
      database: { condition: service_healthy }
      auth-templates: { condition: service_started }
      mail: { condition: service_started }
    ports: ['127.0.0.1:9999:9999']
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:9999
      GOTRUE_SITE_URL: http://localhost:8081
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${LOCAL_AUTH_PASSWORD:-}@database:5432/ridr
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      GOTRUE_JWT_ISSUER: http://127.0.0.1:9999
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@ridr.test
      GOTRUE_SMTP_SENDER_NAME: Ridr local test
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://auth-templates:8080/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://auth-templates:8080/recovery.html
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9999/health']
      interval: 3s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.31.1
    profiles: [auth]
    ports: ['127.0.0.1:8025:8025']
    # No relay/SMTP forwarding: every test email remains in this local inbox.
    environment:
      MP_MAX_MESSAGES: 100
      MP_DISABLE_VERSION_CHECK: 'true'
  auth-templates:
    image: busybox:1.37.0
    profiles: [auth]
    command: ['httpd', '-f', '-p', '8080', '-h', '/www']
    volumes: ['./auth/templates:/www:ro']
volumes:
  database:
